[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "querydistill-rl"
version = "0.1.0"
description = "QueryDistill-RL - Efficient Small-LLM Post-Training for Text-to-SQL via Knowledge Distillation, QLoRA, Verifiable RL, GPTQ Quantization and vLLM Serving"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "QueryDistill-RL author" }]
keywords = ["text-to-sql", "grpo", "qlora", "gptq", "distillation", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.27",
  "pydantic>=2.13",
  "pyyaml>=6.0",
  "sqlglot>=30.0",
  "datasets>=5.0",
  "psutil>=7.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.13",
  "transformers>=5.15",
  "trl>=1.10",
  "peft>=0.20",
  "accelerate>=1.14",
  "bitsandbytes>=0.50",
  "sentencepiece>=0.2",
]
serve = [
  "vllm>=0.12",
  "openai>=1.0",
]
dev = [
  "pytest>=9.0",
  "ruff>=0.16",
]

[project.scripts]
querydistill = "querydistill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/querydistill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: tests that require a CUDA GPU (deselect with '-m \"not gpu\"')"]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:datasets.*",
  "ignore::DeprecationWarning:trl.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["artifacts", "data", "reports", "models", "checkpoints", "runs", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

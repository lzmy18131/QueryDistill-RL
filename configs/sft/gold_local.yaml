# Gold-SFT local experiment config (NOT run in first round).
# Keep parameters matched with distilled_local.yaml for a fair comparison.
stage: sft
model_name_or_path: Qwen/Qwen3-0.6B-Base
template: qwen
dataset_alias: querydistill_gold
dataset_dir: artifacts/sft/gold_local/dataset
source_examples_path: data/tiny_sql/examples.jsonl
target_mode: gold
train_splits: [train]
paired_manifest_path: artifacts/sft/paired_manifest.json
output_dir: checkpoints/sft/gold_local
logging_dir: runs/sft/gold_local
finetuning_type: lora
quantization_bit: 4
double_quantization: true
quantization_type: nf4
compute_dtype: bf16
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
logging_steps: 5
save_steps: 50
save_total_limit: 2
bf16: true
fp16: false
gradient_checkpointing: true
report_to: none
max_seq_length: 1024
packing: false
overwrite_output_dir: true
resume_from_checkpoint: true

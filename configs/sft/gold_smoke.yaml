# Gold-SFT QLoRA smoke (LLaMA-Factory). Target = gold SQL from tiny fixtures.
# First round only: 2 steps, verifies forward/backward/optimizer/save/resume.
stage: sft
model_name_or_path: models/qwen3-0.6b-base
template: qwen
dataset_alias: querydistill_gold
dataset_dir: artifacts/sft/gold_smoke/dataset
source_examples_path: data/tiny_sql/examples.jsonl
target_mode: gold
train_splits: [train]
output_dir: checkpoints/sft/gold_smoke
logging_dir: runs/sft/gold_smoke
finetuning_type: lora
quantization_bit: 4
double_quantization: true
quantization_type: nf4
compute_dtype: bf16
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 1.0
max_steps: 2
logging_steps: 1
save_steps: 10
bf16: true
fp16: false
gradient_checkpointing: true
report_to: none
max_seq_length: 512
packing: false
overwrite_output_dir: true
resume_from_checkpoint: true
